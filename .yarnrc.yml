nodeLinker: node-modules

# Own packages are exempt from the npm minimum-release-age gate: the gate exists
# to let a compromised third-party publish be caught before it is installed, and
# these releases are cut from repositories in this account. Without it, tracking
# a fresh release of one of them means waiting out npmMinimalAgeGate.
npmPreapprovedPackages:
  - '@libraz/*'
